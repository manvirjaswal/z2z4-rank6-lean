# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Infinitely many elliptic curves with torsion Z/2Z × Z/4Z and rank at least six"
  description: >-
    A Lean 4 and Mathlib formalization of the paper "Infinitely many elliptic curves with torsion
    Z/2Z × Z/4Z and rank at least six" by Manvir Jaswal. Theorem 1.1 says that infinitely many
    elliptic curves over Q have torsion subgroup Z/2Z × Z/4Z and rank at least six, with infinitely
    many distinct j-invariants. The curves are fibers of a one-parameter family of Dujella and
    Peral, y² = x(x + a²)(x + b²), which has rank three over Q(m) and gains three further
    independent points over the function field of a curve C of genus one; congruences carry the
    independence of the six points, and the torsion, from one rational point of C to infinitely
    many. Theorem 1.2 shows that the smooth projective model of C is isomorphic over Q to an
    elliptic curve of conductor 9240 and rank one, that the family has rank exactly six over Q(C),
    and that at all but finitely many rational points of C its fibers have torsion exactly
    Z/2Z × Z/4Z and rank at least six. Theorem 8.1 gives a second such family, over a curve of genus
    one whose Jacobian has rank two. All 19 numbered results of the paper are proved. The theorems
    take published theorems of other authors as hypotheses, each stated in general form, about no
    curve or surface of the paper; Theorem 1.1 takes four: Mazur's torsion theorem, the integrality
    of torsion points at odd primes, that reduction at a prime of good reduction is a homomorphism,
    and that the points of an elliptic curve over Q_p form a compact topological group. Comparator
    checks Theorem 1.1; the other results are proved in the same library.
  authors:
    - "Manvir Jaswal"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Manvir Jaswal"

classification:
  arxiv: ["math.NT"]
  msc2020: ["11G05", "14J27", "11G35"]

