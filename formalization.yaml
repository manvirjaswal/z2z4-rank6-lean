status:
  scope: >-
    Formalized: all 19 numbered results of the paper, among them Theorem 1.1
    (Z2Z4Rank6.theorem_1_1), Theorem 1.2 (a)–(c) and Theorem 8.1 (a)–(d), by the paper's own route;
    the ranks, points, independence statements, genera, conductors and local computations of the
    paper are proved, not assumed. Comparator checks Theorem 1.1 only; the other results are proved
    in the same library, and the main ones are listed under alignment. Hypotheses: published
    theorems of other authors, each a Lean proposition passed as an explicit argument (no axiom is
    added) and stated in general form, about no curve or surface of the paper. Theorem 1.1 assumes
    four: Mazur's torsion theorem, the integrality of torsion points at odd primes (Silverman,
    Theorem VII.3.4), that reduction at a prime of good reduction is a homomorphism (Silverman,
    Proposition VII.2.1), and that the points of an elliptic curve over Q_p form a compact
    topological group in which the inclusion of the affine solutions is an open embedding (Milne,
    Chapter II, §4). The other results use further ones, 56 in all, among them the Mordell–Weil
    theorem, Faltings' theorem, and results on minimal models, Jacobians and elliptic surfaces; the
    README of the archived release lists each with its source. Lemmas 2.1, 2.2 and 3.2, Proposition
    4.2 and Remark 4.3 use Mathlib alone. Not formalized: the historical survey, the heuristic rank
    predictions and the search averages, which are context rather than results.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

automation:
  methods:
    - method: "agent"
      tool_setup: >-
        The Lean code was written by AI agents working from the paper: they chose the formal
        statements and wrote the proofs.

fidelity:
  divergences: >-
    The proofs follow the paper, with some differences. The genera of the first base curve and of
    the signed covers are computed from affine charts and structure-sheaf cohomology, not from the
    paper's pencil or branch count. Two-descent bounds use explicit square-class coordinates, local
    obstructions and reconstruction data, all proved in Lean. The isomorphism of the first base
    curve with E_C (Lemma 4.1(b), Theorem 1.2(a)) comes from explicit maps and an isomorphism of
    function fields, not from Theorem 2.8(iii) of Cremona, Fisher and Stoll. The paper gives the
    conductor 9240 by its LMFDB label, states 683760 and 182747931661680, and prints the squarefree
    conductor of the curve in Theorem 8.1(d); here all four are computed by Ogg's formula, from
    minimal models and component counts given by published theorems taken as hypotheses. Remark 8.2
    uses an explicit infinite subset of the printed 3-adic neighborhood that also satisfies the six
    independence congruences; its infinitude is proved by a recurrence, and the independence by
    reduction as in Section 6, instead of by Silverman's specialization theorem. The README of the
    archived release lists these differences and the others.

review:
  status: "agent-reviewed"
  notes: >-
    The formal statements of all the numbered results were checked against the printed paper, and
    each of the 56 hypotheses against its source: each is true, general, and no stronger than its
    source.

